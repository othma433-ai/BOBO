name: AL-thmany 4.0 Integration Build

on:
  workflow_dispatch:

  push:
    branches:
      - althmany-4.0-integration
    paths:
      - "app/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - "gradle/**"
      - "gradlew"
      - ".github/workflows/althmany-4.0-integration.yml"

permissions:
  contents: read

concurrency:
  group: althmany-4.0-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test and Build AL-thmany 4.0
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Find SDK Manager
        id: sdk
        shell: bash
        run: |
          set -Eeuo pipefail

          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(
              find "$ANDROID_SDK_ROOT/cmdline-tools" \
                -type f -name sdkmanager \
                | sort -V \
                | tail -n 1
            )"
          fi

          test -x "$SDKMANAGER"

          echo "sdkmanager=$SDKMANAGER" >> "$GITHUB_OUTPUT"

      - name: Install Android SDK
        shell: bash
        run: |
          set -Eeuo pipefail

          yes | "${{ steps.sdk.outputs.sdkmanager }}" --licenses >/dev/null || true

          "${{ steps.sdk.outputs.sdkmanager }}" \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;35.0.0"

      - name: Prepare Gradle
        shell: bash
        run: |
          set -Eeuo pipefail

          chmod +x gradlew
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

          java -version
          ./gradlew --version

      - name: Unit Tests
        shell: bash
        run: |
          set -Eeuo pipefail

          ./gradlew \
            testDebugUnitTest \
            --no-daemon \
            --console=plain

      - name: Build Debug APK
        shell: bash
        run: |
          set -Eeuo pipefail

          ./gradlew \
            assembleDebug \
            --no-daemon \
            --console=plain

      - name: Verify APK
        shell: bash
        run: |
          set -Eeuo pipefail

          APK="$(
            find app/build/outputs/apk/debug \
              -type f \
              -name "*.apk" \
              | head -n 1
          )"

          test -n "$APK"

          echo "APK=$APK"
          ls -lh "$APK"
          sha256sum "$APK"

      - name: Upload AL-thmany 4.0 APK
        uses: actions/upload-artifact@v4
        with:
          name: AL-thmany-4.0-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AL-thmany-4.0-Test-Reports
          path: |
            app/build/reports/tests/**
            app/build/test-results/**
          if-no-files-found: ignore
          retention-days: 14
