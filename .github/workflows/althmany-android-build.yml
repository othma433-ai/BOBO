name: AL-thmany Android Build

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - "app/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - "gradle/**"
      - "gradlew"
      - ".github/workflows/althmany-android-build.yml"

permissions:
  contents: read

concurrency:
  group: althmany-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Verify Android SDK
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          test -d "$ANDROID_SDK_ROOT"

          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_SDK_ROOT/cmdline-tools" \
              -type f -name sdkmanager | sort -V | tail -n 1)"
          fi

          test -x "$SDKMANAGER"

          echo "SDKMANAGER=$SDKMANAGER"
          "$SDKMANAGER" --version

      - name: Accept Android licenses
        shell: bash
        run: |
          set -Eeuo pipefail

          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_SDK_ROOT/cmdline-tools" \
              -type f -name sdkmanager | sort -V | tail -n 1)"
          fi

          yes | "$SDKMANAGER" --licenses >/dev/null || true

      - name: Install required Android SDK packages
        shell: bash
        run: |
          set -Eeuo pipefail

          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_SDK_ROOT/cmdline-tools" \
              -type f -name sdkmanager | sort -V | tail -n 1)"
          fi

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;35.0.0"

      - name: Verify environment
        shell: bash
        run: |
          set -Eeuo pipefail

          java -version

          chmod +x gradlew

          ./gradlew --version

          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

      - name: Build Debug APK
        shell: bash
        run: |
          set -Eeuo pipefail

          ./gradlew \
            clean \
            assembleDebug \
            --no-daemon \
            --console=plain \
            --stacktrace

      - name: APK information
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "===== GENERATED APK ====="

          find app/build/outputs/apk/debug \
            -type f \
            -name "*.apk" \
            -exec ls -lh {} \;

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: AL-thmany-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
